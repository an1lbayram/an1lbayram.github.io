name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-unit:
    name: Lint, unit/component/a11y/SEO tests, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint (code quality)
        run: npm run lint

      - name: Unit / component / integration / accessibility / SEO / security tests
        run: npm run test:coverage

      - name: Build
        run: npm run build
        env:
          VITE_WEB3FORMS_ACCESS_KEY: ${{ secrets.VITE_WEB3FORMS_ACCESS_KEY }}

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14

      - name: Upload production build (for the e2e/lighthouse jobs)
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1

  e2e:
    name: E2E / cross-browser / responsive / a11y (Playwright)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox webkit

      # Gorsel regresyon ayri bir job'ta: referans goruntuler bu runner'da
      # uretilmeli, aksi halde farkli isletim sistemi/font render'i yuzunden
      # her kosuda patlarlar. Buradaki kosu islevsel + erisilebilirlik
      # kapsamini calistirir, ekran goruntusu karsilastirmalarini atlar.
      - name: Run Playwright tests
        run: npx playwright test --ignore-snapshots

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  visual:
    name: Visual regression (Playwright, baseline uretimi)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    # Depoda henuz bu runner'da uretilmis referans goruntu yok. Job her
    # kosuda guncel goruntuleri uretip artifact olarak yukluyor; bunlar
    # e2e/visual.spec.js-snapshots/ altina commit'lendikten sonra
    # --update-snapshots kaldirilip continue-on-error kapatilabilir.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Generate visual baselines
        run: npx playwright test --project=chromium e2e/visual.spec.js --update-snapshots

      - name: Upload generated baselines
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-baselines
          path: e2e/visual.spec.js-snapshots/
          retention-days: 14

  lighthouse:
    name: Lighthouse (Performance + SEO + Accessibility + Best Practices)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Download production build
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Run Lighthouse CI
        run: npm run test:lighthouse
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}

      - name: Upload Lighthouse report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 14

  dependency-audit:
    name: Dependency security (npm audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (fails on high/critical)
        run: npm audit --omit=dev --audit-level=high
