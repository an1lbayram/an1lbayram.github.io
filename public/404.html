<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Sayfa bulunamadı | Anıl Bayram</title>
  <link rel="icon" href="/icons/A.ico" />
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #0d0e12; color: #f0ede7; padding: 24px;
      font-family: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
      text-align: center;
    }
    .kod { font-family: ui-monospace, "JetBrains Mono", monospace; font-size: 14px;
           letter-spacing: .14em; text-transform: uppercase; color: #f59e0b; }
    h1 { font-size: clamp(28px, 6vw, 44px); margin: 12px 0 8px; letter-spacing: -.02em; }
    p { margin: 0 0 32px; color: #9aa1ac; max-width: 42ch; line-height: 1.6; }
    a {
      display: inline-flex; align-items: center; gap: 8px; padding: 12px 24px;
      border-radius: 10px; background: #f59e0b; color: #14161c;
      font-weight: 600; text-decoration: none; transition: background .2s ease;
    }
    a:hover { background: #fbbf24; }
    a:focus-visible { outline: 2px solid #f59e0b; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <p class="kod">404</p>
    <h1>Bu sayfa bulunamadı</h1>
    <p>Aradığın sayfa taşınmış veya hiç var olmamış olabilir. Ana sayfadan devam edebilirsin.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
